<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 8 — Submitted Details</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="container"><nav class="page-nav"><a href="index.html">← All labs</a> · <a href="lab8.html">Edit details</a></nav><section class="panel"><p class="eyebrow">LAB 08 · RESULTS PAGE</p><h1>Your details</h1><p id="message" class="muted"></p><div class="table-wrap"><table id="detailTable" hidden><tbody id="details"></tbody></table></div></section></main><script>const fields=[['Name','name'],['Gender','gender'],['Mobile number','mobile'],['Email address','email'],['City','city'],['State','state'],['Country','country']],tbody=document.querySelector('#details');let details;try{details=JSON.parse(sessionStorage.getItem('lab8Details')||'null')}catch{details=null}if(details&&typeof details==='object'){for(const [label,key] of fields){const row=document.createElement('tr'),head=document.createElement('th'),data=document.createElement('td');head.textContent=label;data.textContent=details[key]||'—';row.append(head,data);tbody.append(row)}document.querySelector('#detailTable').hidden=false;sessionStorage.removeItem('lab8Details')}else document.querySelector('#message').textContent='No form details were provided. Return to the form to enter your information.';</script></body></html>
