<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 4 — Country and Capital</title><link rel="stylesheet" href="assets/style.css"><style>.capital{color:#145fa0;font-weight:800;font-size:1.5rem}</style></head><body><main class="container"><nav class="page-nav"><a href="index.html">← All labs</a></nav><section class="panel"><p class="eyebrow">LAB 04</p><h1>Country and Capital</h1><p>Select one of the five countries.</p><label class="field" for="country">Country<select id="country"><option value="">Choose a country</option><option>India</option><option>United States</option><option>Japan</option><option>France</option><option>United Kingdom</option></select></label><p>Capital: <span class="capital" id="capital" aria-live="polite">—</span></p></section></main><script>const capitals={India:'New Delhi','United States':'Washington, D.C.',Japan:'Tokyo',France:'Paris','United Kingdom':'London'};document.querySelector('#country').addEventListener('change',e=>document.querySelector('#capital').textContent=capitals[e.target.value]||'—');</script></body></html>
