<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 9 — XML Table</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="container"><nav class="page-nav"><a href="index.html">← All labs</a></nav><section class="panel"><p class="eyebrow">LAB 09</p><h1>Countries from XML</h1><p>This page fetches <code>countries.xml</code> and builds a table from its data.</p><button id="load">Load XML data</button><div id="status" class="result" aria-live="polite">Press “Load XML data” to read the file.</div><div class="table-wrap"><table id="countryTable" hidden><thead><tr><th>Country</th><th>Capital</th><th>Continent</th></tr></thead><tbody></tbody></table></div></section></main><script>const status=document.querySelector('#status'),table=document.querySelector('#countryTable');document.querySelector('#load').addEventListener('click',async()=>{status.textContent='Loading…';table.hidden=true;try{const response=await fetch('countries.xml');if(!response.ok)throw Error('HTTP '+response.status);const xml=new DOMParser().parseFromString(await response.text(),'application/xml');if(xml.querySelector('parsererror'))throw Error('Invalid XML');const countries=[...xml.querySelectorAll('country')];if(!countries.length)throw Error('No country records found');const body=table.querySelector('tbody');body.replaceChildren();for(const c of countries){const row=document.createElement('tr');for(const key of ['name','capital','continent']){const cell=document.createElement('td');cell.textContent=c.querySelector(key)?.textContent.trim()||'';row.append(cell)}body.append(row)}table.hidden=false;status.textContent=`Loaded ${countries.length} country records.`}catch(error){status.textContent='Could not load the XML file. Make sure you opened this project through a web server. '+error.message;status.classList.add('error')}});</script></body></html>
