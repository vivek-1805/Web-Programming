<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 7 — Calculator</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="container"><nav class="page-nav"><a href="index.html">← All labs</a></nav><section class="panel"><p class="eyebrow">LAB 07</p><h1>Basic Calculator</h1><form id="calc"><div class="form-grid"><label class="field">First number<input id="a" type="number" step="any" required></label><label class="field">Second number<input id="b" type="number" step="any" required></label></div><label class="field">Operation<select id="op"><option value="+">Addition (+)</option><option value="-">Subtraction (−)</option><option value="*">Multiplication (×)</option><option value="/">Division (÷)</option></select></label><button>Calculate</button></form><div class="result" id="answer" aria-live="polite">Result will appear here.</div></section></main><script>document.querySelector('#calc').addEventListener('submit',e=>{e.preventDefault();const a=Number(document.querySelector('#a').value),b=Number(document.querySelector('#b').value),op=document.querySelector('#op').value;let result;if(op==='+')result=a+b;else if(op==='-')result=a-b;else if(op==='*')result=a*b;else if(b===0){document.querySelector('#answer').textContent='Cannot divide by zero.';return}else result=a/b;document.querySelector('#answer').textContent=`Result: ${result}`});</script></body></html>
