<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 8 — User Information</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="container"><nav class="page-nav"><a href="index.html">← All labs</a></nav><section class="panel"><p class="eyebrow">LAB 08</p><h1>User Information Form</h1><p>Complete the form to see your information on a separate results page.</p><form id="userForm"><div class="form-grid"><label class="field">Name<input name="name" required autocomplete="name"></label><label class="field">Gender<select name="gender" required><option value="">Choose…</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select></label><label class="field">Mobile number<input name="mobile" type="tel" required autocomplete="tel"></label><label class="field">Email address<input name="email" type="email" required autocomplete="email"></label><label class="field">City<input name="city" required autocomplete="address-level2"></label><label class="field">State<input name="state" required autocomplete="address-level1"></label><label class="field">Country<input name="country" required autocomplete="country-name"></label></div><button type="submit">Display details</button></form></section></main><script>document.querySelector('#userForm').addEventListener('submit',e=>{e.preventDefault();const details=Object.fromEntries(new FormData(e.currentTarget).entries());sessionStorage.setItem('lab8Details',JSON.stringify(details));location.href='lab8-result.html'});</script></body></html>
